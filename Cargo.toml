[workspace]
members = [
  "crates/core",
  "crates/engine",
  "crates/runner",
  "crates/runtime",
  "crates/toolchain",
  "src-tauri",
  "xtask",
]
default-members = ["crates/core", "crates/toolchain", "crates/engine", "crates/runner"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"

[workspace.dependencies]
bindgen = "0.73"
cargo_metadata = "0.23"
cc = { version = "1.4", features = ["parallel"] }
clap = { version = "4.6", features = ["derive"] }
cxx = "1.0"
cxx-build = "1.0"
libloading = "0.9"
llvm-sys = { version = "231.0", features = ["prefer-dynamic"] }
object = { version = "0.40", default-features = false, features = ["read", "std", "elf"] }
oplab-core = { path = "crates/core" }
oplab-engine = { path = "crates/engine" }
oplab-runtime = { path = "crates/runtime" }
oplab-toolchain = { path = "crates/toolchain" }
proptest = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tauri = "2.11"
tauri-build = "2.6"
tauri-plugin-dialog = "2.7"
tempfile = "3.27"
thiserror = "2.0"
# ts-rs cannot represent serde's enum unknown-field validation in TypeScript.
# Suppress that export warning; serde still rejects unknown fields at runtime.
ts-rs = { version = "12.0", features = ["no-serde-warnings"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Preserve explicit module visibility; unreachable_pub enforces this convention.
redundant_pub_crate = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
overflow-checks = true
codegen-units = 1
lto = "thin"
strip = true
